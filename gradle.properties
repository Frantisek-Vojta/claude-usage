# Plugin coordinates -- change `pluginGroup` / `pluginId` to something globally
# unique (e.g. based on your own GitHub handle) before publishing.
pluginGroup = dev.fvojta.claudeusage
pluginId = dev.fvojta.claude-usage-monitor
pluginName = Claude Usage Monitor
pluginVersion = 0.1.0

# Lowest supported IDE build. 251 == 2025.1
pluginSinceBuild = 251

# Build against IntelliJ IDEA Community
platformType = IC
platformVersion = 2025.1

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
